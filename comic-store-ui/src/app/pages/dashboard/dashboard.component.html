<div class="dashboard">

  <h2 class="page-title">Dashboard</h2>

  <div class="stats-grid">
    @for (stat of stats; track stat.label) {
      <mat-card class="stat-card">
        <mat-card-content>
          <div class="stat-row">
            <div>
              <div class="stat-value">{{ stat.value }}</div>
              <div class="stat-label">{{ stat.label }}</div>
            </div>
            <div class="stat-icon" [style.background]="stat.color + '1a'" [style.color]="stat.color">
              <mat-icon>{{ stat.icon }}</mat-icon>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    }
  </div>

  <mat-card class="table-card">
    <mat-card-header>
      <mat-card-title>Recent Sales</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="recentSales">

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let sale">{{ sale.saleDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="items">
          <th mat-header-cell *matHeaderCellDef>Items</th>
          <td mat-cell *matCellDef="let sale">{{ sale.items.length }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let sale">{{ sale.totalAmount | currency }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </mat-card-content>
  </mat-card>

</div>
