<div class="page">

  <div class="page-header">
    <h2 class="page-title">Sales</h2>
    @if (auth.isAdmin()) {
      <button mat-flat-button color="primary" (click)="openNewSale()">
        <mat-icon>add</mat-icon> New Sale
      </button>
    }
  </div>

  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="sales">

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let sale">{{ sale.saleDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="items">
          <th mat-header-cell *matHeaderCellDef>Items</th>
          <td mat-cell *matCellDef="let sale">{{ sale.items.length }}</td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let sale" class="total-cell">{{ sale.totalAmount | currency }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let sale" class="actions-cell">
            <button mat-stroked-button (click)="viewDetails(sale)">
              <mat-icon>receipt_long</mat-icon> Details
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

      <mat-paginator
        [length]="totalElements"
        [pageSize]="pageSize"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPageChange($event)">
      </mat-paginator>
    </mat-card-content>
  </mat-card>

</div>
