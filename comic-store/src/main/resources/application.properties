spring.application.name=comic-store
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comic_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# CORS
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:4200}

# JWT
app.jwt.secret=${JWT_SECRET:comic-store-super-secret-key-for-local-dev-only-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
